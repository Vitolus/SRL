name: pytorch
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - matplotlib
  - huggingface_hub
  - transformers[version='>=5.12']
  - accelerate
  - optimum
  - evaluate
  - datasets
  - scikit-learn
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm
  - optuna
  - pandas
  - seaborn
  - pysoundfile
  - librosa
  - num2words
  - setuptools
  - peft
  - trl[version='>=1.7.0']
  - pytorch[version='>=2.12']
  - torchaudio
  - torchvision
  - wandb
  - pip:
      - bitsandbytes
      - unsloth
      - unsloth_zoo
